# demo-app-web — non-root nginx (uid 101), port 8080
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Docker gömülü DNS; değişkenli proxy_pass sayesinde upstream çözülemese de nginx açılır.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"service":"demo-app-web","status":"ok"}';
        }

        # Derleme kimliği (Dockerfile ARG DEMO_APP_BUILD_SHA / DEMO_APP_WEB_TREE; boşsa "").
        location = /build.json {
            access_log off;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            try_files /build.json =404;
        }

        # Test uçları (/test/reset) dışarı açılmaz: e2e yalnızca kendi API örneğini sıfırlar.
        location ^~ /api/test/ {
            default_type application/json;
            return 404 '{"detail":"Not Found"}';
        }

        location /api/ {
            set $demo_api http://demo-app-api:8000;
            rewrite ^/api/(.*)$ /$1 break;
            # Uygulamanın herkese açık API vekili (hedef sabit: demo-app-api); `internal` olamaz.
            proxy_pass $demo_api;  # nosemgrep: generic.nginx.security.missing-internal.missing-internal
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
