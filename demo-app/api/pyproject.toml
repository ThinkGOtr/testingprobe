[project]
name = "demoapp-api"
version = "0.2.0"
description = "Bayi Sipariş Portalı örnek uygulaması — API (giriş, katalog, sepet, kampanya, sipariş)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demoapp_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: DEMOAPP_TEST_PG_URL ile gerçek Postgres'e karşı"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Türkçe metinlerde (ı) yanlış pozitif verir.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["demoapp_api"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Cookie", "fastapi.Header"]
