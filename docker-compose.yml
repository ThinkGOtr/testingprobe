# AI Testing Probe — yerel geliştirme ve demo ortamı (F0)
# Başlatma `make up` ile; PLAYWRIGHT_VERSION .playwright-version'dan gelir ve `make env` onu
# .env'e de yazar (düz `docker compose ps/logs/exec/restart` bu sayede çalışır).
# Ağlar (bkz. specs/001-dev-foundation/research.md R5):
#   core-net   : normal ağ; çekirdek servisler + host'a açılan arayüzler
#   data-net   : internal; postgres <-> demo-app-api
#   demo-net   : internal; örnek uygulama (web + api) ve test-runner
#   agent-net  : internal; yalnızca playwright-mcp <-> demo-app-web (ajan tarayıcısı)
#   runner-net : internal; toolchain-worker <-> test-runner
#   mcp-net    : internal; yalnızca core-worker <-> playwright-mcp
#   app-mcp-net: internal; yalnızca core-worker <-> app-mcp (mobil/masaüstü ajan aracı, 009)
#   cihaz-net  : yalnızca app-mcp + appium-gw(-windows); hosttaki Appium'a (host.docker.internal:4723)
#                ve Windows VM Appium'una çıkış için internal DEĞİL (internal ağdan host'a ve VPC'ye
#                ulaşılamaz). GCP'de (Linux Docker Engine) bu ağdan çıkış host IP'sine NAT'lanır
#                (tp-demo 10.156.0.2 → tp-windows:4723; Windows güvenlik duvarı yalnızca bu kaynağa
#                izin verir). docs/CIHAZ-ALTYAPISI.md §5, docs/WINDOWS-GCP.md
#   appium-net : internal; yalnızca test-runner <-> appium-gw / appium-gw-windows (LocalForge Java
#                koşusu, 009 §2.7)
# test-runner yalnızca demo-net + runner-net + appium-net'te: postgres, core-api, playwright-mcp ve
# internete erişemez; demo-app-web'e (UI) ve demo-app-api'ye (/test/* sıfırlama + kırılma, belirteçli)
# erişir. Tek ağ istisnası: appium-gw üzerinden YALNIZCA host.docker.internal:4723 (Appium) ve
# `mobil-windows` profilinde appium-gw-windows üzerinden YALNIZCA TP_WINDOWS_VM_APPIUM (VM Appium).
# playwright-mcp yalnızca agent-net + mcp-net'te: tarayıcısı (ve browser_run_code_unsafe gibi
# kapatılamayan araçları) yalnızca demo-app-web'e ulaşır (nginx /api/test/*'i kapatır); core-api,
# jira-sim, postgres, demo-app-api, test-runner ve internete erişemez; host'a port açmaz.

# Proje adı ve imaj öneki ortamdan değiştirilebilir (yalıtılmış ikinci yığın; bkz. .env.example).
name: ${COMPOSE_PROJECT_NAME:-testingprobe}

# İmajı yalnızca `migrate` derler; core-api/core-worker aynı yerel imajı kullanır (build yok,
# pull_policy: never). Aynı imajı üç servisin ayrı ayrı derlemesi `make up`'ı idempotent olmaktan
# çıkarıyordu (her çalıştırmada yeniden derleme → gereksiz yeniden oluşturma).
x-core-image: &core-image
  image: ${TP_IMAGE_PREFIX:-testingprobe}-core:local
  pull_policy: never

# Ortak çekirdek ortamı (core-api + core-worker). Yazma yetkili kimlikler burada DEĞİL:
# core-api yalnızca Postgres'e yazar (MIMARI-SOZLESME §2); Jira/Xray/forge yazma kimlikleri ve
# model anahtarı yalnızca core-worker'da (make security-check 6 ve 8).
x-core-env: &core-env
  TP_SESSION_SECRET: ${TP_SESSION_SECRET:?}
  # Durum değiştiren isteklerde izinli Origin'ler (CSRF); portal başka adresten sunulursa eklenir.
  TP_ALLOWED_ORIGINS: ${TP_ALLOWED_ORIGINS:-http://127.0.0.1:${TP_PORTAL_PORT:-8080},http://localhost:${TP_PORTAL_PORT:-8080}}
  # Giriş kısıtlaması gerçek istemci adresini yalnızca bu vekilden gelen XFF'den okur.
  TP_TRUSTED_PROXIES: ${TP_TRUSTED_PROXIES:-review-portal}
  TP_MODEL_MODE: ${TP_MODEL_MODE:-auto}
  TP_RULES_DIR: /rules
  JIRA_BASE_URL: ${JIRA_BASE_URL:-http://jira-sim:8090}
  # Kullanıcıya gösterilen bağlantıların kökü (tarayıcıdan erişilebilir). Gerçek Jira'da boş
  # bırakılır → JIRA_BASE_URL kullanılır.
  JIRA_BROWSE_URL: ${JIRA_BROWSE_URL:-http://127.0.0.1:${JIRA_SIM_PORT:-8090}}
  JIRA_PROJECT: ${JIRA_PROJECT:-TPD}
  JIRA_READ_EMAIL: ${JIRA_READ_EMAIL:-reader@sim.local}
  JIRA_READ_TOKEN: ${JIRA_READ_TOKEN:-sim}
  TP_TEST_MGMT: ${TP_TEST_MGMT:-jira}
  # Jira kanalından PO onayı: izinli PO kimlikleri ve ürünün bot kimlikleri (MIMARI-SOZLESME §6).
  # core-api de okur (case üretimi öncesi etiketin hâlâ geçerli olduğu denetimi); sır değildir.
  JIRA_PO_ACCOUNT_IDS: ${JIRA_PO_ACCOUNT_IDS:-}
  TP_PO_JIRA_USERS: ${TP_PO_JIRA_USERS:-}
  TP_JIRA_BOT_ACCOUNT_IDS: ${TP_JIRA_BOT_ACCOUNT_IDS:-}
  # YALNIZ TEST: 1 = ürünün Jira hesabının PO etiketi de onay sayılır (varsayılan kapalı)
  TP_TEST_TEK_HESAP: ${TP_TEST_TEK_HESAP:-0}
  XRAY_BASE_URL: ${XRAY_BASE_URL:-http://jira-sim:8090/xray}
  TP_FORGE: ${TP_FORGE:-local}
  TP_FORGE_PATH: /forge/demo-app.git
  TP_FORGE_PRS_PATH: /forge/tp-prs.json
  GITHUB_REPO: ${GITHUB_REPO:-}
  GITHUB_READ_TOKEN: ${GITHUB_READ_TOKEN:-}
  GITHUB_API_URL: ${GITHUB_API_URL:-}
  TOOLCHAIN_URL: http://toolchain-worker:8100
  # toolchain-worker belirteci: core → toolchain-worker. test-runner'a VERİLMEZ (security-check 4/5).
  TP_TOOLCHAIN_TOKEN: ${TP_TOOLCHAIN_TOKEN:?make env çalıştırın}
  TP_ARTIFACTS_PATH: /artifacts
  # Merge kapısı dosyaları checks/<sha>.json: ayrı `tp_checks` volume'ü (tek yazar toolchain-worker
  # /check; core-api/core-worker salt okur; test-runner hiç bağlamaz).
  TP_CHECKS_PATH: /checks
  TP_MCP_PUBLIC_URL: ${TP_MCP_PUBLIC_URL:-http://127.0.0.1:${TP_API_PORT:-8000}/mcp}
  # HTTPS arkasında (GCP dış kapısı) oturum çerezi Secure olur; yerelde http → false.
  TP_SESSION_COOKIE_SECURE: ${TP_SESSION_COOKIE_SECURE:-false}
  # AI Probe ortak girişi (TEKNIK-TASARIM §8.14, specs/010-aiprobe-sso). Varsayılan `local`: dış
  # çağrı yok, davranış bugünküyle aynı. `aiprobe|both`'ta AIPROBE_* zorunlu (sır değildir; servis
  # kimliği VM metadata'sından gelir). TP_ALLOWED_ORIGINS'e portalın https adresi eklenmeli.
  TP_AUTH_MODE: ${TP_AUTH_MODE:-local}
  AIPROBE_HOME_RUN_URL: ${AIPROBE_HOME_RUN_URL:-}
  AIPROBE_ID_ORIGIN: ${AIPROBE_ID_ORIGIN:-}
  AIPROBE_PRODUCT_ID: ${AIPROBE_PRODUCT_ID:-testing-probe}
  AIPROBE_ALLOWED_ORGS: ${AIPROBE_ALLOWED_ORGS:-}
  AIPROBE_HOME_SA: ${AIPROBE_HOME_SA:-}
  AIPROBE_TP_AUDIENCE: ${AIPROBE_TP_AUDIENCE:-}
  TP_DAILY_BUDGET_USD: ${TP_DAILY_BUDGET_USD:-30}
  TP_WORKFLOW_BUDGET_USD: ${TP_WORKFLOW_BUDGET_USD:-2}
  # Gereksinim akışı (Faz 2): PO etiket sorgu aralığı, tutarlılık turu üst sınırı (core-api de
  # yeniden başlatmada tur sınırını uygular), kanıt deposu.
  TP_PO_POLL_S: ${TP_PO_POLL_S:-15}
  TP_CONSISTENCY_MAX_ROUNDS: ${TP_CONSISTENCY_MAX_ROUNDS:-3}
  TP_FORGE_REPO_NAME: ${TP_FORGE_REPO_NAME:-demo-app}
  TP_FORGE_CHECK_REF: ${TP_FORGE_CHECK_REF:-main}
  # Story başına manuel test tasarımı baz süresi (saniye, F0 ölçümü); boşsa portal "ölçülmedi".
  TP_MANUAL_BASELINE_S: ${TP_MANUAL_BASELINE_S:-}
  # Kod üretimi ekran görüntüleri (`tp_codegen`: core-worker rw, core-api ro).
  TP_CODEGEN_ARTIFACTS_PATH: /codegen-artifacts
  # GitHub koşu artefaktlarının yerel kopyası (`tp_gh_artifacts`: core-worker rw, core-api ro):
  # portal Playwright/JUnit/Allure/günlük bağlantılarını GitHub'a gitmeden core'dan sunar.
  TP_GITHUB_ARTIFACTS_PATH: /github-artifacts
  TP_GITHUB_ARTIFACTS_KEEP: ${TP_GITHUB_ARTIFACTS_KEEP:-30}
  TP_GITHUB_ARTIFACTS_MAX_GB: ${TP_GITHUB_ARTIFACTS_MAX_GB:-5}
  # Kontrol Kulesi pencereleri: son N koşu, flaky ve trend gün sayısı.
  TP_CT_SON_KOSU: ${TP_CT_SON_KOSU:-20}
  TP_CT_FLAKY_GUN: ${TP_CT_FLAKY_GUN:-30}
  TP_CT_TREND_GUN: ${TP_CT_TREND_GUN:-14}
  # Portal asistanı ve Öneri (specs/008-ai-asistan/contracts/env.md). Gizli değildir; model kipi ve
  # anahtar burada YOK (yalnız core-worker). 0 = öneri uçları ve düğmesi kapalı (geri alma).
  TP_ASISTAN_ONERI: ${TP_ASISTAN_ONERI:-1}
  # Sohbet/mesaj/öneri geri bildirimi saklama süresi (gün).
  TP_ASISTAN_SAKLAMA_GUN: ${TP_ASISTAN_SAKLAMA_GUN:-90}
  # Asistan şeridi iş parçacığı; global bekleyen sınırı = 2 × bu (core-api sayacı da okur).
  TP_WORKER_ASISTAN_PARALEL: ${TP_WORKER_ASISTAN_PARALEL:-3}
  # Öneri "Jira'yı aç" (yeni kayıt) adresi; kökeni JIRA_BROWSE_URL ile aynı olmalı. Boş = varsayılan.
  JIRA_CREATE_URL: ${JIRA_CREATE_URL:-}
  # Agent Probe portu (011 §4.5): tp | sim (core-api ajan ürünleri/testleri, core-worker denetim).
  TP_AGENT_PROBE: ${TP_AGENT_PROBE:-tp}

# İmajı yalnızca toolchain-worker derler (`ci` hedefi, MCP yok); test-runner aynı yerel imajı
# kullanır. playwright-mcp ayrı `mcp` hedefini derler (Constitution II: CI imajında ajan yok).
x-toolchain-image: &toolchain-image
  image: ${TP_IMAGE_PREFIX:-testingprobe}-toolchain:local
  pull_policy: never

x-toolchain-build: &toolchain-build
  build:
    context: ./toolchain
    target: ci
    args:
      PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:?make up ile çalıştırın}
  pull_policy: build

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TP_OWNER_PASSWORD: ${TP_OWNER_PASSWORD:?}
      TP_APP_PASSWORD: ${TP_APP_PASSWORD:?}
      DEMOAPP_OWNER_PASSWORD: ${DEMOAPP_OWNER_PASSWORD:?}
      DEMOAPP_PASSWORD: ${DEMOAPP_PASSWORD:?}
      DEMOAPP_RO_PASSWORD: ${DEMOAPP_RO_PASSWORD:?}
    volumes:
      - tp_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432"
    networks: [core-net, data-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tp"]
      interval: 3s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits: { memory: 1g }

  migrate:
    <<: *core-image
    build:
      context: ./core
    pull_policy: build
    command: ["alembic", "upgrade", "head"]
    environment:
      TP_DATABASE_URL: postgresql+psycopg://tp_owner:${TP_OWNER_PASSWORD}@postgres:5432/tp
    networks: [core-net]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  core-api:
    <<: *core-image
    command: ["uvicorn", "tp_core.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TP_DATABASE_URL: postgresql+psycopg://tp_app:${TP_APP_PASSWORD}@postgres:5432/tp
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?}
      # Portal kişi adları (yalnızca gösterim; yetki roldedir). Boş = seed demo varsayılanları.
      TP_GORUNEN_ADLAR: ${TP_GORUNEN_ADLAR:-}
      <<: *core-env
    volumes:
      - tp_forge:/forge:ro
      - tp_artifacts:/artifacts:ro
      - tp_checks:/checks:ro
      - tp_codegen:/codegen-artifacts:ro
      - tp_gh_artifacts:/github-artifacts:ro
      - ./rules:/rules:ro
    ports:
      - "127.0.0.1:${TP_API_PORT:-8000}:8000"
    networks: [core-net]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: { memory: 512m }

  core-worker:
    <<: *core-image
    # Sabit hostname: release_orphans yeniden oluşturulan worker'ın eski işlerini adıyla bulur.
    hostname: core-worker
    command: ["python", "-m", "tp_core.worker"]
    environment:
      TP_DATABASE_URL: postgresql+psycopg://tp_app:${TP_APP_PASSWORD}@postgres:5432/tp
      # Model anahtarı ve model ayarları YALNIZCA core-worker'da (anayasa: anahtar core-worker'da).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Çalışma alanına bağlı anahtar için `anthropic-workspace-id` başlığı (sır; yalnızca core-worker).
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      TP_MODEL_PROVIDER: ${TP_MODEL_PROVIDER:-anthropic}
      TP_PII_MASKING: ${TP_PII_MASKING:-0}
      TP_REPLAY_STRICT: ${TP_REPLAY_STRICT:-0}
      PLAYWRIGHT_MCP_URL: http://playwright-mcp:8931/mcp
      # Mobil/masaüstü doğrulama ajanının aracı (009; app-mcp `mobil` profiliyle başlar).
      # Yedek yol (konteyner UTM ağına ulaşamazsa): app-mcp hostta süreç olarak koşar ve
      # APP_MCP_URL=http://host.docker.internal:<port>/mcp verilir (docs/WINDOWS-VM.md §5.1).
      APP_MCP_URL: ${APP_MCP_URL:-http://app-mcp:8932/mcp}
      # Yazma yetkili dış sistem kimlikleri — yalnızca core-worker.
      JIRA_WRITE_EMAIL: ${JIRA_WRITE_EMAIL:-writer@sim.local}
      JIRA_WRITE_TOKEN: ${JIRA_WRITE_TOKEN:-sim}
      XRAY_CLIENT_ID: ${XRAY_CLIENT_ID:-sim}
      XRAY_CLIENT_SECRET: ${XRAY_CLIENT_SECRET:-sim}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_MERGE_TOKEN: ${GITHUB_MERGE_TOKEN:-}
      GH_APP_ID: ${GH_APP_ID:-}
      GH_APP_PRIVATE_KEY: ${GH_APP_PRIVATE_KEY:-}
      GH_APP_PRIVATE_KEY_PATH: ${GH_APP_PRIVATE_KEY_PATH:-}
      GH_APP_INSTALLATION_ID: ${GH_APP_INSTALLATION_ID:-}
      # Merge kapısının zorunlu check'leri (boş = adaptör varsayılanı: local-ci / ruleset listesi)
      TP_REQUIRED_CHECKS: ${TP_REQUIRED_CHECKS:-}
      # Jira yorumlarında rol @bahsetmeleri (accountId; boş = yok). Yalnızca bildirim, yetki değil.
      JIRA_HESAP_ANALIST: ${JIRA_HESAP_ANALIST:-}
      JIRA_HESAP_PO: ${JIRA_HESAP_PO:-}
      JIRA_HESAP_MUHENDIS: ${JIRA_HESAP_MUHENDIS:-}
      JIRA_HESAP_TESTCI: ${JIRA_HESAP_TESTCI:-}
      # Tutarlılık denetiminin veri araçları (salt okuma rolü; core-api demoapp'e hiç bağlanmaz).
      DEMOAPP_RO_DATABASE_URL: postgresql+psycopg://demoapp_ro:${DEMOAPP_RO_PASSWORD:?}@postgres:5432/demoapp?require_auth=scram-sha-256
      # Kod üretimi doğrulama ajanı (Faz 3): ajanın bayisi (e2e bayileriyle çakışmaz) ve uygulama kökü.
      # Ajan sepeti her doğrulamadan önce uygulamanın herkese açık API'siyle (core-net) boşaltılır.
      TP_AGENT_DEALER: ${TP_AGENT_DEALER:-bayi3}
      TP_AGENT_DEALER_PASSWORD: ${TP_AGENT_DEALER_PASSWORD:-Demo123!}
      TP_DEMO_WEB_URL: http://demo-app-web:8080
      # Jira'ya yazılan kanıt bağlantılarının kökü (portal nginx /api/artifacts sunar; Faz 4).
      TP_PUBLIC_BASE_URL: ${TP_PUBLIC_BASE_URL:-http://127.0.0.1:${TP_PORTAL_PORT:-8080}}
      # Yerel CI (Faz 3): gece koşusu saati (Europe/Istanbul; "kapali" kapatır), GitHub yoklama aralığı
      # ve zaman aşımı.
      TP_CI_NIGHTLY_SAAT: ${TP_CI_NIGHTLY_SAAT:-02:00}
      TP_CI_GITHUB_POLL_S: ${TP_CI_GITHUB_POLL_S:-30}
      TP_CI_GITHUB_TIMEOUT_S: ${TP_CI_GITHUB_TIMEOUT_S:-5400}
      # Portal asistanı (yalnız core-worker; core-api kipi bilmez, durumu asistan_durum'dan okur).
      # Model kipi pipeline'dan bağımsız: live | off (kod varsayılanı off). Anahtar yukarıdaki
      # ANTHROPIC_API_KEY'dir.
      TP_ASISTAN_MODEL_MODE: ${TP_ASISTAN_MODEL_MODE:-off}
      # 0 = otomatik Sonnet yükseltmesi kapalı ("Daha ayrıntılı incele" düğmesi kalır).
      TP_ASISTAN_OTOMATIK_DERIN: ${TP_ASISTAN_OTOMATIK_DERIN:-1}
      # 1 = müşteri verisi kurulumu: TP_PII_MASKING kapalıysa asistan kapalı (maskeleme_kapali).
      TP_ASISTAN_MUSTERI_VERISI: ${TP_ASISTAN_MUSTERI_VERISI:-0}
      # db_schema/db_query izinli roller (virgülle; boş = tüm roller).
      TP_ASISTAN_VERI_ROLLERI: ${TP_ASISTAN_VERI_ROLLERI:-}
      # 0 = asistan şeridi ve kalp atışı yok → asistan etkin=false (worker_yok).
      TP_WORKER_ASISTAN_SERIT: ${TP_WORKER_ASISTAN_SERIT:-1}
      # Asistan denetimi (011 F7): on | off; puan < ENGEL → engelle, < UYARI → uyarı notu.
      TP_ASISTAN_DENETIM: ${TP_ASISTAN_DENETIM:-on}
      TP_ASISTAN_DENETIM_ENGEL: ${TP_ASISTAN_DENETIM_ENGEL:-40}
      TP_ASISTAN_DENETIM_UYARI: ${TP_ASISTAN_DENETIM_UYARI:-70}
      # ci_log için yalnız actions:read token (sır; boş = mevcut okuma kimliği).
      GITHUB_ACTIONS_READ_TOKEN: ${GITHUB_ACTIONS_READ_TOKEN:-}
      <<: *core-env
    volumes:
      - tp_forge:/forge
      # Paylaşılan artefaktlar salt okunur: checks/<sha>.json (merge kapısı) yalnızca toolchain-worker
      # /check yazar. Ajan ekran görüntüleri ayrı volume'e (core-api ro).
      - tp_artifacts:/artifacts:ro
      - tp_checks:/checks:ro
      - tp_codegen:/codegen-artifacts
      - tp_gh_artifacts:/github-artifacts
      # TP_MODEL_MODE=record konteyner içinde kullanılacaksa :ro kaldırılır.
      - ./rules:/rules:ro
      # Asistanın ürün bilgi paketi (make asistan-paket; yalnızca core-worker, salt okunur).
      - ./var/tp-bilgi:/opt/tp-bilgi:ro
    networks: [core-net, mcp-net, app-mcp-net]
    restart: unless-stopped
    # Worker SIGTERM'de elindeki işi bitirir; yeniden başlayınca kalan işleri bırakır (release_orphans).
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-m", "tp_core.worker.healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: { memory: 512m }

  toolchain-worker:
    <<: [*toolchain-build, *toolchain-image]
    command: ["toolchain-worker"]
    environment:
      PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION}
      TEST_RUNNER_URL: http://test-runner:8200
      TP_FORGE_PATH: /forge/demo-app.git
      # Çalışan demo-app-web'in derlendiği forge commit'i (/locator-probe sha eşleşmesi); boşsa
      # yanıt 'dogrulanamadi' + uyarı döner (öneri insana gider).
      # Asıl kaynak forge-init/break/sync-web'in yazdığı /forge/demo-app-web.sha dosyasıdır
      # (TP_APP_BUILD_SHA_FILE); bu değişken yalnızca dosya yokken kullanılır.
      DEMO_APP_BUILD_SHA: ${DEMO_APP_BUILD_SHA:-}
      TP_ARTIFACTS_PATH: /artifacts
      # Merge kapısı ayrı volume'de; bağlama noktası değilse /check kapı dosyasını yazmaz (503).
      TP_CHECKS_PATH: /checks
      TP_CHECKS_REQUIRE_MOUNT: "1"
      # GitHub modu: yerel forge'da olmayan sha'lar salt okunur belirteçle aynaya çekilir (boş = kapalı).
      TP_FORGE_REMOTE_URL: ${TP_FORGE_REMOTE_URL:-}
      TP_FORGE_REMOTE_TOKEN: ${TP_FORGE_REMOTE_TOKEN:-}
      TP_FORGE_MIRROR_PATH: /forge-mirror/demo-app.git
      # Uç noktalar (/health hariç) Bearer belirteç ister; belirteçsiz başlatma 503 + degraded.
      TP_TOOLCHAIN_TOKEN: ${TP_TOOLCHAIN_TOKEN:?make env çalıştırın}
      TP_TOOLCHAIN_REQUIRE_TOKEN: "1"
      # Forge deposunda e2e kökü: LocalForge 'e2e'; TP_FORGE=github iken 'demo-app/e2e'
      # (core TP_FORGE_APP_ROOT varsayılanı 'demo-app' ile eşleşmeli).
      TP_E2E_ROOT: ${TP_E2E_ROOT:-e2e}
      # Java e2e kökü (009 §2.3; /symbols, /check, /ast-guard `lang=java`): LocalForge 'e2e-app';
      # TP_FORGE=github iken 'demo-app/e2e-app'.
      TP_E2E_APP_ROOT: ${TP_E2E_APP_ROOT:-e2e-app}
      # Çalışan uygulamanın commit eşleşmesinde karşılaştırılan uygulama yolları (/check `app`,
      # /locator-probe): LocalForge 'web,api'; TP_FORGE=github iken 'demo-app/web,demo-app/api'.
      TP_APP_PATHS: ${TP_APP_PATHS:-web,api}
    volumes:
      # Forge'u yalnızca okur (git archive / ast-guard git-ref modu).
      - tp_forge:/forge:ro
      - tp_artifacts:/artifacts
      - tp_checks:/checks
      - tp_forge_mirror:/forge-mirror
    networks: [core-net, runner-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    shm_size: 1gb
    deploy:
      resources:
        limits: { memory: 2g }

  test-runner:
    <<: *toolchain-image
    command: ["test-runner"]
    environment:
      PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION}
      TP_FORGE_PATH: /forge/demo-app.git
      TP_ARTIFACTS_PATH: /artifacts
      # e2e hedefi: compose'daki demo uygulaması. Bayi kapsamlı sıfırlama ve kampanya kırılması
      # (/test/reset, /test/break) doğrudan API'ye belirteçle gider; nginx /api/test/*'i kapatır.
      BASE_URL: http://demo-app-web:8080
      DEMO_API_URL: http://demo-app-api:8000
      DEMOAPP_TEST_TOKEN: ${DEMOAPP_TEST_TOKEN:?make env çalıştırın}
      TP_FORGE_MIRROR_PATH: /forge-mirror/demo-app.git
      TP_E2E_ROOT: ${TP_E2E_ROOT:-e2e}
      # Java (Appium) koşusu (009 §2.7, runner/java_run.py): e2e-app kökü ve platform başına Appium.
      # Appium hostta; test-runner ona yalnızca appium-gw (TCP yönlendirici, `mobil` profili)
      # üzerinden ulaşır. Boş = o platformun Java koşusu sağlık kontrolünde `error`. Windows (GCP
      # tp-windows ya da UTM VM): `mobil-windows` profilindeki appium-gw-windows; açıkça verilir
      # (TP_RUNNER_APPIUM_URL_WINDOWS=http://appium-gw-windows:4723), varsayılan boş = kapalı.
      # /test/* sıfırlaması (DEMO_API_URL) her zaman bu yığının demo-app-api'sidir; Windows
      # uygulaması aynı API'ye dış kapıdan (TP_APP_ARGS_WINDOWS=--api-url https://<bayi>/api) gider.
      TP_E2E_APP_ROOT: ${TP_E2E_APP_ROOT:-e2e-app}
      APPIUM_URL_ANDROID: ${TP_RUNNER_APPIUM_URL_ANDROID:-http://appium-gw:4723}
      APPIUM_URL_IOS: ${TP_RUNNER_APPIUM_URL_IOS:-http://appium-gw:4723}
      APPIUM_URL_WINDOWS: ${TP_RUNNER_APPIUM_URL_WINDOWS:-}
      # Appium hostundaki kurulu uygulama (make cihaz-baslat kurar) ve cihaz seçimi.
      TP_APP_ID_ANDROID: ${TP_APP_ID_ANDROID:-com.antreklabs.bayisiparis}
      TP_APP_ID_IOS: ${TP_APP_ID_IOS:-com.antreklabs.bayisiparis}
      TP_APP_ID_WINDOWS: ${TP_APP_ID_WINDOWS:-}
      TP_APP_PATH_WINDOWS: ${TP_APP_PATH_WINDOWS:-}
      # Windows: NovaWindows appArguments / appWorkingDir (ör. --api-url http://192.168.64.1:18081/api).
      TP_APP_ARGS_WINDOWS: ${TP_APP_ARGS_WINDOWS:-}
      TP_APP_WORKDIR_WINDOWS: ${TP_APP_WORKDIR_WINDOWS:-}
      TP_DEVICE_UDID_ANDROID: ${APP_ANDROID_UDID:-}
      TP_DEVICE_UDID_IOS: ${APP_IOS_UDID:-}
    volumes:
      - tp_forge:/forge:ro
      - tp_artifacts:/artifacts
      # tp_checks BAĞLANMAZ: üretilen kod merge kapısı dosyasını göremez/yazamaz.
      - tp_forge_mirror:/forge-mirror:ro
    networks: [demo-net, runner-net, appium-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    shm_size: 1gb
    deploy:
      resources:
        limits: { memory: 3g }

  playwright-mcp:
    image: ${TP_IMAGE_PREFIX:-testingprobe}-toolchain-mcp:local
    build:
      context: ./toolchain
      target: mcp
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:?make up ile çalıştırın}
    pull_policy: build
    command: ["playwright-mcp"]
    environment:
      MCP_ALLOWED_ORIGINS: http://demo-app-web:8080
      # Host başlığı denetimi (DNS rebinding): yalnızca core-worker'ın kullandığı ad.
      MCP_ALLOWED_HOSTS: playwright-mcp:8931,playwright-mcp
    # Host'a port açılmaz; hata ayıklama: docker compose exec playwright-mcp … (.env'de
    # PLAYWRIGHT_VERSION olmalı: make env yazar).
    networks: [agent-net, mcp-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8931,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    shm_size: 1gb
    deploy:
      resources:
        limits: { memory: 2g }

  # Mobil/masaüstü doğrulama ajanının aracı (specs/009-mobil-masaustu §2.6). Appium hostta koşar
  # (make cihaz-baslat); app-mcp ona host.docker.internal üzerinden bağlanır. Varsayılan yığına
  # girmez: `docker compose --profile mobil up -d app-mcp` (cihaz altyapısı olmadan anlamsız).
  # `mobil-windows` profilinde de başlar: GCP'de (tp-demo) hostta Appium yoktur, yalnız Windows VM
  # vardır (APPIUM_URL_WINDOWS=http://appium-gw-windows:4723; docs/WINDOWS-GCP.md).
  # Host'a port açılmaz; yalnızca core-worker app-mcp-net üzerinden ulaşır.
  app-mcp:
    image: ${TP_IMAGE_PREFIX:-testingprobe}-app-mcp:local
    build:
      context: ./toolchain/app-mcp
    pull_policy: build
    profiles: [mobil, mobil-windows]
    init: true
    environment:
      APP_MCP_HOST: 0.0.0.0
      APP_MCP_PORT: "8932"
      # Host başlığı denetimi (DNS rebinding): yalnızca core-worker'ın kullandığı ad.
      APP_MCP_ALLOWED_HOSTS: app-mcp:8932,app-mcp
      APP_MCP_IDLE_S: ${APP_MCP_IDLE_S:-300}
      # Platform başına Appium adresi; boş = platform kapalı. Windows: GCP'de
      # http://appium-gw-windows:4723 (cihaz-net), UTM'de VM adresi.
      APPIUM_URL_ANDROID: ${APPIUM_URL_ANDROID:-http://host.docker.internal:4723}
      APPIUM_URL_IOS: ${APPIUM_URL_IOS:-http://host.docker.internal:4723}
      APPIUM_URL_WINDOWS: ${APPIUM_URL_WINDOWS:-}
      # Ajan yalnızca bu uygulamayı başlatabilir (app_launch platform dışında argüman almaz).
      APP_ANDROID_PACKAGE: ${APP_ANDROID_PACKAGE:-com.antreklabs.bayisiparis}
      APP_ANDROID_ACTIVITY: ${APP_ANDROID_ACTIVITY:-.MainActivity}
      APP_ANDROID_UDID: ${APP_ANDROID_UDID:-}
      APP_IOS_BUNDLE_ID: ${APP_IOS_BUNDLE_ID:-com.antreklabs.bayisiparis}
      APP_IOS_UDID: ${APP_IOS_UDID:-}
      APP_WINDOWS_APP: ${APP_WINDOWS_APP:-}
      APP_WINDOWS_ARGS: ${APP_WINDOWS_ARGS:-}
      APP_WINDOWS_WORKDIR: ${APP_WINDOWS_WORKDIR:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [app-mcp-net, cihaz-net]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 512m }

  # test-runner'ın hosttaki Appium'a TEK çıkışı (009 §2.7; docs/CIHAZ-ALTYAPISI.md §5.1).
  # Internal ağdan host'a ulaşılamadığı için test-runner internal ağlarda kalır; bu yönlendirici
  # appium-net (internal) üzerinden gelen bağlantıyı yalnızca host.docker.internal:4723'e iletir
  # (hedef sabit; komut satırı dışında yapılandırma yok). Böylece koşan test kodu internete ya da
  # hosttaki başka bir porta DOĞRUDAN çıkamaz. Kalan risk: Appium API'sinin kendisi (ör. `app`
  # yeteneğine URL → hosttan indirme, emülatörün kendi ağı); bkz. docs/CIHAZ-ALTYAPISI.md §5.1. Tek amaçlı socat (alpine tabanlı, özetle sabit); root değil,
  # salt okunur, yetkisiz; dışarıdan girdi almaz (ajan/test kodu yalnızca TCP akışı gönderir).
  # Varsayılan yığına girmez: `docker compose --profile mobil up -d appium-gw`.
  appium-gw:
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    profiles: [mobil]
    command:
      - "TCP-LISTEN:4723,fork,reuseaddr,max-children=16"
      - "TCP:host.docker.internal:4723,connect-timeout=10"
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [appium-net, cihaz-net]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 64m }

  # test-runner'ın (ve GCP'de app-mcp'nin) Windows sanal makinesindeki Appium'a çıkışı (009 §2.7).
  # Birincil yol GCP: tp-demo → tp-windows iç IP'si (docs/WINDOWS-GCP.md); isteğe bağlı UTM
  # (docs/WINDOWS-VM.md §5.3). appium-gw ile aynı sertleştirme; hedef yalnızca TP_WINDOWS_VM_APPIUM
  # (host:port, varsayılan 192.168.64.2:4723) ve konteyner açılışında biçimi doğrulanır (socat adres
  # seçeneği enjekte edilemez: virgül, boşluk vb. reddedilir). Ayrı profil: VM yokken `mobil`
  # profili bozulmaz. Port açmaz; test-runner yalnızca appium-net'ten (internal) ulaşır.
  #   docker compose --profile mobil-windows up -d appium-gw-windows
  #   .env: TP_RUNNER_APPIUM_URL_WINDOWS=http://appium-gw-windows:4723
  # Docker Desktop'ın konteynerden UTM ağına (192.168.64.0/24) yönlendirmesi bu Mac'te VM ile
  # denenmedi (docs/WINDOWS-VM.md §5.3).
  appium-gw-windows:
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    profiles: [mobil-windows]
    environment:
      HEDEF: ${TP_WINDOWS_VM_APPIUM:-192.168.64.2:4723}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        h="$$HEDEF"
        port="$${h##*:}"
        # Önce izinli karakter kümesi (tüm dize: satır sonu da reddedilir; grep satır satır eşler).
        gecersiz=0
        case "$$h" in ''|*[!A-Za-z0-9.:-]*) gecersiz=1 ;; esac
        if [ "$$gecersiz" = 1 ] || ! printf '%s\n' "$$h" | grep -Eqx '[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?:[0-9]{1,5}' \
          || [ "$$port" -lt 1 ] || [ "$$port" -gt 65535 ]; then
          echo "TP_WINDOWS_VM_APPIUM host:port biçiminde olmalı (ör. 192.168.64.2:4723): '$$h'" >&2
          exit 64
        fi
        exec socat TCP-LISTEN:4723,fork,reuseaddr,max-children=16 "TCP:$$h,connect-timeout=10"
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [appium-net, cihaz-net]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 64m }

  jira-sim:
    image: ${TP_IMAGE_PREFIX:-testingprobe}-jira-sim:local
    build:
      context: ./sims/jira-sim
    pull_policy: build
    environment:
      JIRA_SIM_DATA: /data/jira.json
      JIRA_SIM_BASE_URL: http://127.0.0.1:${JIRA_SIM_PORT:-8090}
      # PO girişi (po@sim.local) parolası ve /sim/* yönetim belirteci — make env üretir.
      JIRA_SIM_PO_PASSWORD: ${JIRA_SIM_PO_PASSWORD:?make env çalıştırın}
      JIRA_SIM_ADMIN_TOKEN: ${JIRA_SIM_ADMIN_TOKEN:?make env çalıştırın}
    volumes:
      - tp_jira:/data
    ports:
      - "127.0.0.1:${JIRA_SIM_PORT:-8090}:8090"
    networks: [core-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: { memory: 256m }

  review-portal:
    image: ${TP_IMAGE_PREFIX:-testingprobe}-review-portal:local
    build:
      context: ./review-portal
    pull_policy: build
    ports:
      - "127.0.0.1:${TP_PORTAL_PORT:-8080}:8080"
    environment:
      # CSP kipe göre (review-portal/docker/40-tp-kimlik-csp.sh): local → değişmez; aiprobe/both →
      # connect-src ve img-src'ye yalnız AI Probe başlangıç kökeni eklenir (değiştirici).
      TP_AUTH_MODE: ${TP_AUTH_MODE:-local}
      AIPROBE_HOME_ORIGIN: ${AIPROBE_ID_ORIGIN:-https://home.aiprobe.antreklabs.com}
    networks: [core-net]
    restart: unless-stopped
    depends_on:
      core-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits: { memory: 128m }

  demo-app-api:
    image: ${TP_IMAGE_PREFIX:-testingprobe}-demo-app-api:local
    build:
      context: ./demo-app/api
    pull_policy: build
    environment:
      DEMOAPP_DATABASE_URL: postgresql+psycopg://demoapp:${DEMOAPP_PASSWORD}@postgres:5432/demoapp?require_auth=scram-sha-256
      # /test/reset ve /test/break (e2e fixture'ları) için; yalnızca demo ortamı. Uçlar yalnızca
      # demo-net'ten (test-runner) ve DEMOAPP_TEST_TOKEN ile çağrılabilir.
      DEMOAPP_TEST_MODE: "1"
      DEMOAPP_TEST_TOKEN: ${DEMOAPP_TEST_TOKEN:?make env çalıştırın}
      # Kampanya kırılması koşu başına ve bayi kapsamlıdır: POST /test/break (BREAK_CAMPAIGN
      # süreç geneli ortam değişkeni compose'da kullanılmaz). Locator kırılması: make break.
    networks: [data-net, demo-net]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: { memory: 256m }

  demo-app-web:
    image: ${TP_IMAGE_PREFIX:-testingprobe}-demo-app-web:local
    build:
      context: ./demo-app/web
    pull_policy: build
    ports:
      - "127.0.0.1:${DEMO_WEB_PORT:-8081}:8080"
    networks: [core-net, demo-net, agent-net]
    restart: unless-stopped
    depends_on:
      demo-app-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits: { memory: 128m }

networks:
  core-net: {}
  data-net: { internal: true }
  demo-net: { internal: true }
  agent-net: { internal: true }
  runner-net: { internal: true }
  mcp-net: { internal: true }
  app-mcp-net: { internal: true }
  appium-net: { internal: true }
  cihaz-net: {}

volumes:
  tp_pgdata: {}
  tp_forge: {}
  tp_artifacts: {}
  tp_codegen: {}
  tp_gh_artifacts: {}
  tp_checks: {}
  tp_forge_mirror: {}
  tp_jira: {}
