# GCP (tek VM) katmanı: dış dünyaya yalnızca `edge` (Caddy) açılır — 80 (ACME + https yönlendirme)
# ve 443. Diğer tüm portlar ana dosyadaki gibi 127.0.0.1'de kalır (make security-check 1 yalnızca
# bu iki portu istisna tutar). Etkinleştirme: VM'deki .env'de
#   COMPOSE_FILE=docker-compose.yml:deploy/gcp/docker-compose.gcp.yml
# (docker compose ve tüm make hedefleri bu katmanı otomatik kullanır). Kurulum: docs/GCP-KURULUM.md
services:
  edge:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - "80:80"
      - "443:443"
    environment:
      TP_PORTAL_HOST: "${TP_PORTAL_HOST:?GCP: TP_PORTAL_HOST (ör. portal.<ip>.sslip.io)}"
      TP_DEMO_HOST: "${TP_DEMO_HOST:?GCP: TP_DEMO_HOST (ör. bayi.<ip>.sslip.io)}"
      TP_ACME_EMAIL: "${TP_ACME_EMAIL:?GCP: TP_ACME_EMAIL (Let's Encrypt bildirimleri)}"
    volumes:
      - ./deploy/gcp/Caddyfile:/etc/caddy/Caddyfile:ro
      - tp_caddy_data:/data
      - tp_caddy_config:/config
    networks: [core-net]
    restart: unless-stopped
    # make up / make status her servisi "healthy" bekler; Caddy'nin yerel yönetim ucu (yalnız konteyner içi)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      review-portal: { condition: service_started }
      demo-app-web: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 128m }

volumes:
  tp_caddy_data: {}
  tp_caddy_config: {}
