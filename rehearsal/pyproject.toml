[project]
name = "tp-rehearsal"
version = "0.1.0"
description = "AI Testing Probe demo provası: 14 adım + locator kırma/onarım, canlı yerel yığına karşı"
requires-python = ">=3.12,<3.13"
# Çalışma zamanı bağımlılığı yok (yalnızca standart kütüphane): prova makinesinde `uv sync`
# ağ istemesin, sunucu makinesinde de aynı betik çalışsın.
dependencies = []

[project.scripts]
tp-prova = "tp_rehearsal.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_rehearsal"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Türkçe metinlerde (ı) yanlış pozitif verir.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["tp_rehearsal"]
