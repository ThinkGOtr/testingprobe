# gitleaks yapılandırması: varsayılan kurallar aynen, yalnız belgelenmiş yanlış alarm izinli.
# `.gitleaksignore` commit önekli parmak izleri tutar ve `gitleaks dir` (security-check 4b, commit
# edilmemiş içerik) taramasında eşleşmez; aynı yanlış alarm burada kural düzeyinde tanımlanır.
# Not: genel `[[allowlists]]` içindeki `paths` dosyayı bütünüyle atlar; bu yüzden yol koşulu yok,
# izin yalnız `generic-api-key` bulgusunun eşleşmesine uygulanır (aynı satırdaki gerçek sır yakalanır).
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "eval çağrı defteri: id_or_key alanı kayıt UUID'si / Jira anahtarıdır, sır değil"
  regexTarget = "match"
  regexes = ['''^id_or_key"\s*:\s*"(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[A-Z][A-Z0-9]+-[0-9]+)"$''']
