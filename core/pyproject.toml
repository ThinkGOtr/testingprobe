[project]
name = "tp-core"
version = "0.1.0"
description = "AI Testing Probe çekirdek servisi (API, worker, migrasyon, seed)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.69",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "jsonschema>=4.23",
    "mcp>=1.15",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6",
    "sqlalchemy>=2.0,<3",
    "sqlglot>=27",
    "sse-starlette>=2.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "gherkin-official>=42.0.1",
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: çalışan compose ortamına karşı"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Türkçe metinlerde (ı) yanlış pozitif verir.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["tp_core"]
known-third-party = ["alembic"]
