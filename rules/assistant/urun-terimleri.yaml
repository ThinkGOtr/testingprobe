# "Ürüne özgü soru" sınıflandırması (AI-ASISTAN-PLANI §5.4; deterministik, modelsiz).
#
# Bir soru ürüne özgüdür, eğer: bağlamda ana sayfa dışı bir varlık/rota varsa, VEYA soruda
# `[A-Z]+-\d+` biçimli bir anahtar geçiyorsa, VEYA soru bu listedeki bir terimi içeriyorsa, VEYA
# model bir ürün/probe/uygulama aracı çağırdıysa. Ürüne özgü soruda yalnız `genel_bilgi` kaynaklı
# cevap en fazla "Kısmen" gösterilir.
#
# Eşleşme: soru ve terim Türkçe küçük harfe çevrilir (I→ı, İ→i), boşluklar teke indirilir; terim
# bir kelime başında başlamalıdır (önek eşleşmesi: "gereksinim" → "gereksinimi", "gereksinimler").
# Kural: yalnız Testing Probe'a (ya da demo uygulamasına) özgü adlar girer. "test", "flaky", "bug",
# "ci", "jira", "locator" gibi genel QA terimleri GİRMEZ — "Flaky test nasıl ayıklanır?" genel
# bilgi sorusudur (kural testi bunu denetler).
