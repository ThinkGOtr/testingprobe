# Görev başına model, parametre ve fiyat tablosu (TEKNIK-TASARIM §8.8).
# Değişiklik bundle_hash'i değiştirir (model + params hash'e girer) → replay kayıtları yeniden üretilmeli.
version: 1

# USD / 1M token (Anthropic birinci taraf API fiyatları, 2026-10).
# cache_write = 1.25 × input (5 dk ephemeral), cache_read = 0.1 × input.
# Haiku 5.5 fiyatı ≤100K token'lık istekler içindir (üstü 0.50 / 2.50); demo istekleri bunun altında.
pricing_usd_per_mtok:
  claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50 }
  claude-haiku-5-5: { input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125 }
  # Ret yedeği hedefleri (hiçbir amaç bunları seçmez). Sonnet 5.5 isteklerine `fallbacks: "default"`
  # gider; sunucu ret kategorisine göre başka modele yönlendirebilir (ör. Opus 5.5). Yanıtı üreten
  # model bu tabloda yoksa geçit en pahalı satırı uygular ve `ek.maliyet_tahmini` yazar.
  claude-opus-5-5: { input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00 }
  claude-opus-5: { input: 5.00, output: 25.00, cache_read: 0.50, cache_write: 6.25 }

defaults:
  max_tokens: 4096
  # İstemci zaman aşımı (sn). Taşıma ayarıdır; bundle hash'ine girmez. max_tokens >= 8192 olan
  # amaçlar akışla gönderilir (Anthropic adaptörü); zaman aşımı tek istek için üst sınırdır ve
  # geçit zaman aşımını en çok bir kez yeniden dener.
  timeout_s: 120
  params:
    # Tasarım: temperature 0–0,2. Anthropic API'si (2026-10-21) ve kurulu SDK örnekleme
    # parametrelerini kabul etmez; Anthropic adaptörü göndermez. Diğer sağlayıcılar (Azure) kullanır.
    temperature: 0

purposes:
  # Sonnet sınıfı: case üretimi ve ajanlar
  requirement_review:
    model: claude-sonnet-5-5
    max_tokens: 4096
    params: { effort: medium }
  case_generation:
    model: claude-sonnet-5-5
    max_tokens: 32000           # v3 çıktısı (kapsam öğeleri, test verisi, gerekçeler) v2'nin ~2 katı
    timeout_s: 600              # ~10K karakter Türkçe JSON + uyarlamalı düşünme: dakikalar sürebilir
    params: { effort: medium }
  consistency_check:          # ajan: kod (GitHub MCP, salt okuma) + veri (db_query) araçları
    model: claude-sonnet-5-5
    max_tokens: 8192
    max_input_tokens: 150000
    timeout_s: 300              # tur başına
    # `between_tools`: genişletilmiş düşünme kapalı; araçlar arası ilerleme notları yine
    # `thinking` bloğu olarak döner. Ajan döngüsü eski snapshot'ları bağlamdan çıkarır (geçmiş
    # düzenleme) ve bu, sonraki thinking bloklarını geçersizleştirir (yeni hesaplarda 400);
    # `block_binding: drop_block` yalnızca adaptive ile çalışır. Bu yüzden geçit
    # (`Gateway._agent_messages`) ilk düzenlenen mesajdan sonraki asistan turlarından
    # thinking/redacted_thinking bloklarını çıkarır.
    params: { effort: medium, thinking: { type: between_tools } }
  verify_and_map:             # ajan: Playwright MCP doğrulama döngüsü (§8.4)
    model: claude-sonnet-5-5
    max_tokens: 8192
    # Ajan girdi tavanı: turlar boyunca önbelleksiz girdi + önbelleğe yazma toplamı (önbellekten
    # okunan önek sayılmaz; gateway/core.py `_budgeted_input_tokens`). 15 turluk gerçekçi yörünge
    # ~70k; tavan kaçak bağlam büyümesini durdurur. USD tavanı ayrıca Budget ile uygulanır.
    max_input_tokens: 150000
    timeout_s: 300              # tur başına
    params: { effort: medium, thinking: { type: between_tools } }
  verify_and_map_app:         # ajan: app-mcp (Appium) doğrulama döngüsü (009 §2.6; Android/iOS/Windows)
    model: claude-sonnet-5-5
    max_tokens: 8192
    # verify_and_map ile aynı tavanlar: aynı 25 araç bütçesi; erişilebilirlik ağacı web
    # snapshot'ından kısa (app-mcp ≤400 satır / 40 000 karakter keser).
    max_input_tokens: 150000
    timeout_s: 300              # tur başına (ilk app_launch Appium oturumu açar)
    params: { effort: medium, thinking: { type: between_tools } }
  # Haiku sınıfı: triage ve özetleme
  triage:
    model: claude-haiku-5-5
    max_tokens: 2048
    params: { effort: low }
  bug_draft:
    model: claude-haiku-5-5
    max_tokens: 4096
    params: { effort: low }
  dup_rank:
    model: claude-haiku-5-5
    max_tokens: 2048
    params: { effort: low }
  # Portal asistanı (AI-ASISTAN-PLANI §6.1). Prompt paketi ikisinde de `assistant`; şema amaç adıyla
  # aranır (iki şema dosyası birebir aynı). Kipi pipeline'dan bağımsızdır (TP_ASISTAN_MODEL_MODE).
  # Adaptif düşünme açık (thinking alanı yok); düşünme token'ı çıktı olarak hesaba girer.
  # max_retries / max_timeout_retries / fallbacks: geçidin `_complete` yeniden deneme ayarları ve
  # sunucu tarafı ret yedeği (PurposeConfig, §10.3); taşıma ayarıdır, bundle hash'ine girmez.
  assistant:                  # varsayılan (Haiku sınıfı)
    model: claude-haiku-5-5
    max_tokens: 4096
    max_input_tokens: 40000   # önbellekten okunan önek sayılmaz
    timeout_s: 30
    max_retries: 1
    max_timeout_retries: 0
    params: { effort: medium }  # Haiku'da medium: araç seçiminde daha isabetli; ucuz model
  assistant_deep:             # "Daha ayrıntılı incele" ve otomatik yükseltme (Sonnet sınıfı)
    model: claude-sonnet-5-5
    max_tokens: 3000
    max_input_tokens: 60000
    timeout_s: 45
    max_retries: 1
    max_timeout_retries: 0
    fallbacks: none           # sunucu tarafı ret yedeği (Opus'a yönlendirme) kapalı
    params: { effort: low }   # Sonnet low: yeterli kalite, düşük düşünme maliyeti
  # Asistan denetimi (011 F7, K11): soru asistan modeline gitmeden ve cevap gösterilmeden önce puan.
  # Kısa çıktı (puan + kategori + kısa gerekçe), düşük gecikme: düşünme düşük, zaman aşımı kısa, tek
  # yeniden deneme; sunucu tarafı ret yedeği kapalı (ret = denetim çalışmıyor → fail-closed).
  assistant_guard:
    model: claude-haiku-5-5
    max_tokens: 1024
    max_input_tokens: 12000
    timeout_s: 10
    max_retries: 1
    max_timeout_retries: 0
    fallbacks: none
    params: { effort: low }
