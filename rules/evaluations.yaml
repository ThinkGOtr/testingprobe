# Prompt paketlerinin canlı değerlendirme durumu (constitution X).
#
# "Prompt/kural değişikliği değerlendirme setini canlı modelle koşturmadan birleştirilmez."
# Her prompt dosyası (rules/prompts/<ad>.md, `_guardrails` dahil) için bir kayıt zorunludur ve
# kaydın `version` alanı prompt ön bilgisindeki `version` ile aynı olmalıdır (prompt sürümü
# yükseltilip bu dosya güncellenmezse kayıt bayat sayılır, birleştirme kapısı kapanır).
#
# status:
#   pending    canlı değerlendirme bekliyor (yalnızca REPLAY; golden çıktıları elle hazırlanmış)
#   evaluated  değerlendirme seti canlı modelle koşturuldu; `evaluation` zorunlu
#              {date: YYYY-MM-DD, model, provider, results: <rapor yolu/bağlantısı>}
#   waived     sahibin onayladığı, tarihli yönetişim istisnası; `waiver` zorunlu
#              {approved_by, approved_at: YYYY-MM-DD, reason, until: <koşul veya tarih>}
#
# Birleştirme kapısı: `cd core && uv run python -m tp_core.gateway.evaluation --check`
# `pending` kayıt varsa veya kayıt bayatsa çıkış kodu 1'dir. İstisna kaydı YALNIZCA sahip onayıyla
# yazılır; ajanlar/otomasyon `waived` kaydı oluşturmaz.
#
# `guardrails` (ortak `_guardrails.md`) kendi başına çağrılmaz, her prompt'a eklenir: guardrails'i
# içeren HER paket güncel sürümüyle ve `evaluation.guardrails_version` = güncel guardrails sürümüyle
# `evaluated` olunca `make eval-live A=--update-status` guardrails'i de geçişli olarak `evaluated`
# yazar (`eval_set.guardrails_coverage`).
#
# Güncel durum her kaydın `status`/`note` alanındadır (bu başlık tarih taşımaz; `--update-status`
# başlığı korur, kaydın `note`'unu yeniden yazar).
version: 1
bundles:
  guardrails:
    version: 1
    status: pending
    note: Her prompt'a eklenen ortak güvenlik kuralları; ayrı değerlendirme seti yoktur, kapsam geçişlidir
      (diğer 8 paket aynı guardrails sürümüyle canlı değerlendirilince). Canlı değerlendirme yapılmadı.
  requirement-review:
    version: 3
    status: evaluated
    note: 'Canlı değerlendirme 2026-11-01, claude-sonnet-5-5 (anthropic), 5/5 vaka geçti: evaluation/results/requirement-review-v3-2026-11-01.json'
    evaluation:
      date: '2026-11-01'
      model: claude-sonnet-5-5
      provider: anthropic
      results: evaluation/results/requirement-review-v3-2026-11-01.json
      guardrails_version: 1
      calls: evaluation/results/requirement-review-v3-2026-11-01.calls.jsonl
  consistency-check:
    version: 4
    status: pending
    note: 'Golden çıktıları elle hazırlandı; araç adımları demo-app kaynağına karşı denetlenir. Değerlendirme
      seti: rules/evaluation/consistency-check.json (ajan; araç ortamı `consistency`, kanıt yeniden doğrulanır).
      Canlı değerlendirme yapılmadı; onaylı istisna yok.'
  case-generation:
    version: 2
    status: pending
    note: 'Golden çıktıları elle hazırlandı. Değerlendirme seti: rules/evaluation/case-generation.json
      (§12: 5 story × 3 koşu, AC kapsamı). Canlı değerlendirme yapılmadı; onaylı istisna yok.'
  verify-and-map:
    version: 3
    status: pending
    note: 'Faz 3: v3 (eylemdeki her locator''a ilk dayanmadan önce browser_generate_locator) ve verify_and_map
      golden''ları yeniden kaydedildi. Tarayıcı adımları gerçek Playwright MCP''de kaydedildi ve replay_check
      ile tekrarlandı; model çıktısı elle hazırlandı. Bu model değerlendirmesi değildir. Değerlendirme
      seti: rules/evaluation/verify-and-map.json (ajan; araç ortamı `browser`, Playwright MCP). Canlı
      değerlendirme yapılmadı; onaylı istisna yok.'
  triage:
    version: 2
    status: evaluated
    note: 'Canlı değerlendirme 2026-11-01, claude-haiku-5-5 (anthropic), 4/4 vaka geçti: evaluation/results/triage-v2-2026-11-01.json'
    evaluation:
      date: '2026-11-01'
      model: claude-haiku-5-5
      provider: anthropic
      results: evaluation/results/triage-v2-2026-11-01.json
      guardrails_version: 1
      calls: evaluation/results/triage-v2-2026-11-01.calls.jsonl
  bug-draft:
    version: 2
    status: evaluated
    note: 'Canlı değerlendirme 2026-11-01, claude-haiku-5-5 (anthropic), 4/4 vaka geçti: evaluation/results/bug-draft-v2-2026-11-01.json'
    evaluation:
      date: '2026-11-01'
      model: claude-haiku-5-5
      provider: anthropic
      results: evaluation/results/bug-draft-v2-2026-11-01.json
      guardrails_version: 1
      calls: evaluation/results/bug-draft-v2-2026-11-01.calls.jsonl
  dup-rank:
    version: 2
    status: evaluated
    note: 'Canlı değerlendirme 2026-11-01, claude-haiku-5-5 (anthropic), 6/6 vaka geçti: evaluation/results/dup-rank-v2-2026-11-01.json'
    evaluation:
      date: '2026-11-01'
      model: claude-haiku-5-5
      provider: anthropic
      results: evaluation/results/dup-rank-v2-2026-11-01.json
      guardrails_version: 1
      calls: evaluation/results/dup-rank-v2-2026-11-01.calls.jsonl
  assistant:
    version: 1
    status: pending
    note: 'Portal asistanı (AI-ASISTAN-PLANI §6.1, §13): `assistant` (Haiku 5.5) ve `assistant_deep` (Sonnet
      5.5) amaçları aynı paketi kullanır. Golden''lar yalnız test/eval amaçlı ve elle hazırlandı; asistan
      çalışma zamanında golden kullanmaz. Değerlendirme seti: rules/evaluation/assistant.json (iskelet;
      tam set ve düzenek Şerit H). Canlı değerlendirme yapılmadı; onaylı istisna yok.'
