# Unprivileged nginx: non-root user, port 8080, pid/temp paths under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # contracts/health.md — statik servis, bağımlılık kontrolü yok.
    location = /health {
      default_type application/json;
      return 200 '{"service":"review-portal","status":"ok"}';
    }

    # Güvenlik başlıkları. Not: add_header içeren location'lar sunucu düzeyindekileri miras almaz;
    # bu yüzden aynı başlıklar statik location'larda tekrarlanır (snippet: güvenlik başlıkları).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # core-api hazırlık durumu (core `/health`: veritabanı denetimi; 200 ok / 503 degraded, core
    # kapalıysa nginx 502/504). Portalın kendi `/health`'i statiktir; AI Probe home'un on-demand
    # durum yoklaması ("Kapalı · Başlat" → hazır) bunu kullanır. Kısa süreler: yoklama asılı kalmaz.
    location = /api/health {
      resolver 127.0.0.11 valid=10s ipv6=off;
      resolver_timeout 3s;
      set $upstream core-api:8000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$upstream;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE olay akışı: tamponlama kapalı, uzun okuma süresi, HTTP/1.1 kalıcı bağlantı.
    location = /api/events {
      resolver 127.0.0.11 valid=10s ipv6=off;
      resolver_timeout 3s;
      set $upstream core-api:8000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      add_header X-Accel-Buffering "no" always;
      proxy_connect_timeout 3s;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # POST /publish: core iş bitene kadar publish.service.BEKLEME_S (45 sn) bekler, bitmediyse 202
    # {job_id, durum, sonuclar: []} döner (MIMARI-SOZLESME §5). Okuma süresi bu bekleme + payından
    # uzun olmalı; yoksa 202 portala hiç ulaşmaz (nginx 504) ve başarılı yayın hata gibi görünür.
    # Bağ: src/api/nginx.test.ts bu değeri core'daki BEKLEME_S ile karşılaştırır.
    location = /api/publish {
      resolver 127.0.0.11 valid=10s ipv6=off;
      resolver_timeout 3s;
      set $upstream core-api:8000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$upstream;
      proxy_connect_timeout 3s;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Koşu artefaktları (Playwright HTML raporu, JUnit, allure-results, günlük). core kendi CSP'sini
    # gönderir (HTML/SVG/XML: `sandbox allow-scripts ...`; diğerleri `default-src 'none'`). Sunucu
    # düzeyindeki portal CSP'si buraya miras kalırsa tarayıcı İKİ politikayı birden uygular ve raporun
    # satır içi betikleri çalışmaz (boş sayfa). Bu location kendi add_header'ını tanımladığı için
    # sunucu düzeyindekileri miras almaz: yalnızca core'un CSP'si geçerli olur.
    # Bağ: src/api/nginx.test.ts (artefakt location'ında portal CSP'si yok).
    # Playwright HTML raporu: core'un sandbox CSP'si (allow-same-origin YOK, bilerek: rapor güvenilmeyen
    # test çıktısıdır) belgeyi opak kökene koyar; rapor betiği açılışta localStorage okur ve opak kökende
    # SecurityError atıp boş kalır. Raporun <head>'ine yalnızca bellek içi bir Storage yedeği eklenir
    # (localStorage erişilemiyorsa); köken/izinler değişmez, rapor portal oturumuna yine erişemez.
    location ~ ^/api/artifacts/runs/[^/]+/src/(.+/)?results/html/index\.html$ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      resolver_timeout 3s;
      set $upstream core-api:8000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$upstream;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # sub_filter sıkıştırılmamış gövde ister.
      proxy_set_header Accept-Encoding "";
      sub_filter_types text/html;
      sub_filter_once on;
      sub_filter '<head>' '<head><script>(function(){function m(){var d={};return{getItem:function(k){return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[k]=String(v)},removeItem:function(k){delete d[k]},clear:function(){d={}},key:function(i){return Object.keys(d)[i]||null},get length(){return Object.keys(d).length}}}["localStorage","sessionStorage"].forEach(function(n){try{void window[n].length}catch(e){try{Object.defineProperty(window,n,{value:m(),configurable:true})}catch(_){}}})})();</script>';
      add_header Referrer-Policy "same-origin" always;
    }

    location /api/artifacts/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      resolver_timeout 3s;
      set $upstream core-api:8000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$upstream;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Referrer-Policy "same-origin" always;
    }

    # /api/* -> core-api (prefix kırpılır). Docker DNS'i istek anında çözülür;
    # core-api ayakta değilken nginx yine başlar, istek 502/504 döner.
    location /api/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      resolver_timeout 3s;
      set $upstream core-api:8000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$upstream;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    # SPA fallback
    location / {
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "same-origin" always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
