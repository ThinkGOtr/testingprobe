# Unprivileged nginx: non-root user, port 8080, pid/temp paths under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # contracts/health.md — statik servis, bağımlılık kontrolü yok.
    location = /health {
      default_type application/json;
      return 200 '{"service":"review-portal","status":"ok"}';
    }

    # Güvenlik başlıkları. Not: add_header içeren location'lar sunucu düzeyindekileri miras almaz;
    # bu yüzden aynı başlıklar statik location'larda tekrarlanır (snippet: güvenlik başlıkları).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SSE olay akışı: tamponlama kapalı, uzun okuma süresi, HTTP/1.1 kalıcı bağlantı.
    location = /api/events {
      resolver 127.0.0.11 valid=10s ipv6=off;
      resolver_timeout 3s;
      set $upstream core-api:8000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      add_header X-Accel-Buffering "no" always;
      proxy_connect_timeout 3s;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # /api/* -> core-api (prefix kırpılır). Docker DNS'i istek anında çözülür;
    # core-api ayakta değilken nginx yine başlar, istek 502/504 döner.
    location /api/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      resolver_timeout 3s;
      set $upstream core-api:8000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$upstream;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    # SPA fallback
    location / {
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "same-origin" always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
