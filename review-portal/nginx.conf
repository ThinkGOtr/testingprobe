# Unprivileged nginx: non-root user, port 8080, pid/temp paths under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # contracts/health.md — statik servis, bağımlılık kontrolü yok.
    location = /health {
      default_type application/json;
      return 200 '{"service":"review-portal","status":"ok"}';
    }

    # /api/* -> core-api (prefix kırpılır). Docker DNS'i istek anında çözülür;
    # core-api ayakta değilken nginx yine başlar, istek 502/504 döner.
    location /api/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      resolver_timeout 3s;
      set $upstream core-api:8000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$upstream;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # SPA fallback
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
