[project]
name = "testingprobe-toolchain"
version = "0.1.0"
description = "toolchain-worker and test-runner skeletons (AI Testing Probe)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
toolchain-worker = "worker.app:main"
test-runner = "runner.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker", "runner", "toolchain_common"]
