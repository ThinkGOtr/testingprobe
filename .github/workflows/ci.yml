# CI — AI'sız (Constitution II, TEKNIK-TASARIM §8.5).
#
# Bu workflow'da model anahtarı, MCP sunucusu veya ajan bağımlılığı YOKTUR; yalnızca onaylanmış,
# deterministik test kodu koşar. Test edilen uygulama GitHub modunda bu monorepo'nun demo-app/
# dizinidir (local-forge modunda aynı dosyalar repo köküdür).
#
# Zorunlu check'ler (ruleset: scripts/github-ruleset.sh): test-local, ast-guard, semgrep.
# Workflow düzeyinde `paths` filtresi YOKTUR: atlanan zorunlu check PR'ı bekletir. Değişiklik
# tespiti `changes` job'unda yapılır; ilgisiz PR'da job'lar "no-op, başarılı" çıkar.
# Ayrıntılar: .github/CI.md
name: ci
# Çekirdeğin tetiklediği koşular (repository_dispatch deploy / workflow_dispatch) istek kimliğini
# koşu adında taşır: çekirdek koşuyu `GET /actions/workflows/ci.yml/runs` listesinde `[<istek_id>]`
# ile bulur (GitHubForge.find_dispatched_run). Diğer olaylarda GitHub'ın varsayılan başlığı kalır.
run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('ci deploy [{0}]', github.event.client_payload.istek_id || github.event.client_payload.tp_run_id || 'elle')
    || github.event_name == 'workflow_dispatch'
      && format('ci {0} [{1}]', inputs.tetik, inputs.istek_id || 'elle')
    || github.event.pull_request.title || github.event.head_commit.message || 'ci' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    # Gece koşusu: 02:00 UTC = 05:00 TR
    - cron: "0 2 * * *"
  # client_payload: {ref?: test edilecek dal/sha (yoksa varsayılan dal), istek_id? | tp_run_id?:
  # çekirdeğin istek/koşu kimliği (ikisi eşdeğer; koşu adına ve ci-meta.json'a girer), tetik?}
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      tetik:
        description: "Tetik türü (sonuç kaydında görünür)"
        type: choice
        options: [manual, nightly, deploy]
        default: manual
      istek_id:
        description: "Çekirdeğin istek kimliği (koşu adında görünür; [A-Za-z0-9._-], ≤64)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: read

# PR'da yeni push eski koşuyu iptal eder. Çekirdeğin tetiklediği koşular (deploy/elle) istek
# kimliğiyle ayrı gruptadır ve iptal edilmez: çekirdek beklediği koşunun sonucunu her zaman alır.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.client_payload.istek_id || github.event.client_payload.tp_run_id || inputs.istek_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_ROOT: demo-app
  E2E_ROOT: demo-app/e2e
  NODE_VERSION: "22"
  UV_VERSION: "0.8.24"
  # Onarım PR'ları bu dal önekiyle (veya `tp-repair` etiketiyle) açılır → AST koruması repair modunda.
  # Bot'un açtığı ve CASE_BRANCH_PREFIX ile başlamayan her PR da repair modundadır
  # (scripts/github-ast-guard-mode.sh). Çekirdek sabitleriyle aynı olmalı.
  REPAIR_BRANCH_PREFIX: tp/repair-
  CASE_BRANCH_PREFIX: tp/case-
  # Kod üretimi (CasesToCode) testleri şablondan bu dizine yazar; testDir ("./tests") altında olduğu
  # için run-checks.sh ve Sauce aynı koşuda çalıştırır.
  GENERATED_TESTS: demo-app/e2e/tests/generated
  # Çekirdeğin istek kimliği (deploy / elle tetik); `changes` job'u biçimini doğrular.
  TP_ISTEK_ID: ${{ github.event.client_payload.istek_id || github.event.client_payload.tp_run_id || inputs.istek_id || '' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_tests: ${{ steps.decide.outputs.run_tests }}
      pages: ${{ steps.decide.outputs.pages }}
      guard_tool: ${{ steps.decide.outputs.guard_tool }}
      goldens: ${{ steps.decide.outputs.goldens }}
      generated: ${{ steps.decide.outputs.generated }}
      trigger: ${{ steps.decide.outputs.trigger }}
    steps:
      - name: Değişiklikleri tespit et (yalnızca PR)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - 'demo-app/**'
              - '.playwright-version'
              - '.github/workflows/ci.yml'
              - 'toolchain/Dockerfile'
              - 'toolchain/package.json'
              - 'toolchain/package-lock.json'
              - 'scripts/github-demo-serve.sh'
            # ast-guard'ın denetlediği yollar: locator'lar + tsc --strict kapısının dayandığı
            # tsconfig.json (toolchain/ast-guard/src/tsconfig-gate.ts, Constitution IV).
            pages:
              - 'demo-app/e2e/pages/**'
              - 'demo-app/e2e/tsconfig.json'
            generated:
              - 'demo-app/e2e/tests/generated/**'
            guard_tool:
              - 'toolchain/ast-guard/**'
              - 'scripts/github-ast-guard-mode.sh'
            goldens:
              - 'demo-app/**'
              - 'rules/**'
              - 'docs/DEMO-VERISI.md'
              - '.github/golden-drift/**'

      - name: Karar
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          APP: ${{ steps.filter.outputs.app }}
          PAGES: ${{ steps.filter.outputs.pages }}
          GUARD_TOOL: ${{ steps.filter.outputs.guard_tool }}
          GOLDENS: ${{ steps.filter.outputs.goldens }}
          GENERATED: ${{ steps.filter.outputs.generated }}
          DISPATCH_TETIK: ${{ inputs.tetik }}
        run: |
          set -euo pipefail
          if [ -n "$TP_ISTEK_ID" ] && ! [[ "$TP_ISTEK_ID" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "::error::istek_id biçimi geçersiz ([A-Za-z0-9._-], en çok 64 karakter)"
            exit 1
          fi
          case "$EVENT" in
            pull_request)        trigger="pr" ;;
            push)                trigger=push ;;
            schedule)            trigger=nightly ;;
            repository_dispatch) trigger=deploy ;;
            workflow_dispatch)   trigger="${DISPATCH_TETIK:-manual}" ;;
            *)                   trigger="$EVENT" ;;
          esac
          if [ "$EVENT" = "pull_request" ]; then
            run_tests="${APP:-false}"; pages="${PAGES:-false}"; guard_tool="${GUARD_TOOL:-false}"
            goldens="${GOLDENS:-false}"; generated="${GENERATED:-false}"
          else
            # push / gece / deploy / elle: testler her zaman koşar.
            run_tests=true; pages=true; guard_tool=false; goldens=true; generated=false
          fi
          {
            echo "run_tests=$run_tests"
            echo "goldens=$goldens"
            echo "generated=$generated"
            echo "pages=$pages"
            echo "guard_tool=$guard_tool"
            echo "trigger=$trigger"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Değişiklik tespiti"
            echo "| tetik | istek | testler | pages/** | tests/generated/** | ast-guard aracı |"
            echo "|---|---|---|---|---|---|"
            echo "| \`$trigger\` | \`${TP_ISTEK_ID:--}\` | $run_tests | $pages | $generated | $guard_tool |"
          } >> "$GITHUB_STEP_SUMMARY"

  test-local:
    # Zorunlu check. Yerel (GitHub runner) Chromium; Sauce job'unun yedeği.
    name: test-local
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Repo değişkeni: ghcr.io/thinkgotr/tp-toolchain@sha256:<digest> (build-toolchain.yml çıktısı).
      # Boşsa runner üzerinde aynı sürümlerle kurulum yapılır (bkz. .github/CI.md "test-local").
      TOOLCHAIN_IMAGE: ${{ vars.TP_TOOLCHAIN_IMAGE }}
      RUN_TESTS: ${{ needs.changes.outputs.run_tests }}
      TP_TRIGGER: ${{ needs.changes.outputs.trigger }}
      TP_RESULTS_DIR: ${{ github.workspace }}/results
      CI: "true"
    steps:
      - name: No-op (uygulama değişmedi)
        if: env.RUN_TESTS != 'true'
        run: echo "demo-app/** değişmedi; test-local no-op (başarılı)." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: env.RUN_TESTS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # deploy tetiğinde client_payload.ref (yoksa varsayılan dal)
          ref: ${{ github.event.client_payload.ref || '' }}

      - name: Sürüm tutarlılığı (.playwright-version ↔ e2e/package.json)
        if: env.RUN_TESTS == 'true'
        run: |
          set -euo pipefail
          want="$(tr -d '[:space:]' < .playwright-version)"
          have="$(jq -r '.devDependencies["@playwright/test"] // .dependencies["@playwright/test"] // empty' "$E2E_ROOT/package.json")"
          echo "PLAYWRIGHT_VERSION=$want" >> "$GITHUB_ENV"
          if [ "$want" != "$have" ]; then
            echo "::error file=$E2E_ROOT/package.json::@playwright/test ($have) != .playwright-version ($want)"
            exit 1
          fi
          if [ ! -f "$APP_ROOT/ci/run-checks.sh" ]; then
            echo "::error::$APP_ROOT/ci/run-checks.sh bulunamadı (demo-app şeridi sağlar)"
            exit 1
          fi
          mkdir -p "$TP_RESULTS_DIR"
          # Üretilen testler (CasesToCode) testDir altında olmalı: aynı koşuda çalışırlar.
          if [ -d "$GENERATED_TESTS" ]; then
            n="$(find "$GENERATED_TESTS" -type f -name '*.spec.ts' | wc -l | tr -d ' ')"
            echo "Üretilen test dosyası ($GENERATED_TESTS): $n"
          fi

      # --- Yol A: toolchain imajı (digest ile sabit) — yerel kontrol ile aynı imaj ---------------
      - name: GHCR girişi (toolchain imajı)
        if: env.RUN_TESTS == 'true' && env.TOOLCHAIN_IMAGE != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Toolchain imajı uv içermez (toolchain/Dockerfile: uv yalnızca build sırasında bağlanır), ama
      # run-checks.sh API webServer'ı için `uv sync` / `uv run` ister. Runner'daki sabit sürümlü uv
      # imaja salt-okunur bağlanır; Python imajdaki /usr/bin/python3.12'dir (UV_PYTHON).
      # UV_PROJECT_ENVIRONMENT imajda toolchain venv'ini gösterir: demo-app API'si onu EZMESİN diye
      # kendi .venv'ine yönlendirilir.
      - name: uv kurulumu (toolchain imajına bağlanacak)
        if: env.RUN_TESTS == 'true' && env.TOOLCHAIN_IMAGE != ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Testler (toolchain imajında)
        if: env.RUN_TESTS == 'true' && env.TOOLCHAIN_IMAGE != ''
        id: tests_a
        run: |
          set -euo pipefail
          case "$TOOLCHAIN_IMAGE" in
            *@sha256:*) ;;
            *) echo "::error::TP_TOOLCHAIN_IMAGE digest ile sabitlenmeli (…@sha256:…): $TOOLCHAIN_IMAGE"; exit 1 ;;
          esac
          uv_bin="$(command -v uv)"
          docker_args=(
            --rm --user root --network host
            -e CI -e TP_TRIGGER -e TP_RESULTS_DIR=/work/results -e TP_APP_ROOT=/work/demo-app
            -e UV_PROJECT_ENVIRONMENT=/work/demo-app/api/.venv -e UV_CACHE_DIR=/tmp/uv-cache
            -v "$uv_bin:/usr/local/bin/uv:ro"
            -v "$GITHUB_WORKSPACE:/work" -w /work
          )
          # Ön kontrol: imajda uv (bağlanan) + Python 3.12 + node çalışıyor mu? Açık hata ile dur.
          if ! docker run "${docker_args[@]}" "$TOOLCHAIN_IMAGE" \
               bash -c 'uv --version && "$UV_PYTHON" --version && node --version'; then
            echo "::error::Toolchain imajında uv/Python/node çalışmıyor ($TOOLCHAIN_IMAGE). TP_TOOLCHAIN_IMAGE repo değişkenini boşaltın (Yol B) veya imajı düzeltin."
            exit 1
          fi
          # Constitution II: yayımlanan imaj `ci` hedefi olmalı (MCP/model istemcisi yok).
          bash toolchain/security/no-mcp-in-image.sh image "$TOOLCHAIN_IMAGE"
          rc=0
          docker run "${docker_args[@]}" "$TOOLCHAIN_IMAGE" \
            bash demo-app/ci/run-checks.sh --retries=1 2>&1 | tee run-checks.log || rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # --- Yol B: imaj yoksa runner üzerinde aynı sürümler ----------------------------------------
      - name: Node kurulumu
        if: env.RUN_TESTS == 'true' && env.TOOLCHAIN_IMAGE == ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            demo-app/e2e/package-lock.json
            demo-app/web/package-lock.json

      - name: uv kurulumu
        if: env.RUN_TESTS == 'true' && env.TOOLCHAIN_IMAGE == ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: demo-app/api/uv.lock

      - name: Playwright tarayıcı önbelleği
        if: env.RUN_TESTS == 'true' && env.TOOLCHAIN_IMAGE == ''
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.playwright-version') }}-chromium

      - name: Chromium kurulumu (Playwright ${{ env.PLAYWRIGHT_VERSION }})
        if: env.RUN_TESTS == 'true' && env.TOOLCHAIN_IMAGE == ''
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" = "true" ]; then
            npx --yes "playwright@${PLAYWRIGHT_VERSION}" install-deps chromium
          else
            npx --yes "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium
          fi

      - name: Testler (runner üzerinde)
        if: env.RUN_TESTS == 'true' && env.TOOLCHAIN_IMAGE == ''
        id: tests_b
        env:
          TP_APP_ROOT: ${{ github.workspace }}/demo-app
        run: |
          set -euo pipefail
          rc=0
          bash demo-app/ci/run-checks.sh --retries=1 2>&1 | tee run-checks.log || rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # --- Sonuçlar -----------------------------------------------------------------------------
      # Yerel koşuyla (test-runner `src/e2e/results/`) aynı ad ve biçim; tek düz artefakt kökü:
      # ci-meta.json, junit.xml, results.json, allure-results/, playwright-report/, artifacts/,
      # run-checks.log. Düzen ve ci-meta.json alanları: scripts/github-ci-results.sh, .github/CI.md.
      - name: Sonuçları topla (yerel koşu biçimi)
        if: always() && env.RUN_TESTS == 'true'
        env:
          EXIT_A: ${{ steps.tests_a.outputs.exit_code }}
          EXIT_B: ${{ steps.tests_b.outputs.exit_code }}
        run: |
          set -euo pipefail
          bash scripts/github-ci-results.sh --out tp-results \
            --src "$TP_RESULTS_DIR" --src "$E2E_ROOT/results" --app-root "$APP_ROOT" \
            --exit-code "${EXIT_A:-${EXIT_B:-}}" --log run-checks.log --job test-local

      - name: Özet
        if: always() && env.RUN_TESTS == 'true'
        run: |
          set -uo pipefail
          meta=tp-results/ci-meta.json
          {
            echo "### test-local (tetik: \`$TP_TRIGGER\`)"
            if [ -f "$meta" ]; then
              jq -r '"Durum: **\(.durum)**\(if .hata then " — \(.hata | gsub("\n"; " "))" else "" end) · commit `\((.sha // "?")[0:12])`"' "$meta"
              jq -r 'if .stats then .stats | "\n| beklenen | beklenmeyen | flaky | atlanan | süre (sn) |\n|---|---|---|---|---|\n| \(.expected) | \(.unexpected) | \(.flaky) | \(.skipped) | \((.duration_ms / 1000) | floor) |" else "\nresults.json bulunamadı." end' "$meta"
              jq -r 'if (.generated_tests | length) > 0 then "\nÜretilen testler: \(.generated_tests | length) dosya (`\(env.GENERATED_TESTS)`)" else empty end' "$meta"
            else
              echo "ci-meta.json yazılamadı."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artefaktlar
        if: always() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Çekirdek bu adla arar (GitHub API, GitHubForge.list_run_artifacts): test-local-results.
          # Artefakt kökü tp-results/ dizininin içidir (tek yol → ortak üst dizin kırpılır).
          name: test-local-results
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
          path: tp-results/

      - name: Playwright HTML raporu
        if: always() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # İnsanlar için ayrı indirme (aynı içerik test-local-results/playwright-report/ altında da var).
          name: playwright-report
          retention-days: 14
          if-no-files-found: ignore
          path: tp-results/playwright-report/

  ast-guard:
    # Zorunlu check (Constitution VI). PR dışındaki olaylarda no-op.
    name: ast-guard
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IS_PR: ${{ github.event_name == 'pull_request' }}
      PAGES_CHANGED: ${{ needs.changes.outputs.pages }}
      GUARD_TOOL_CHANGED: ${{ needs.changes.outputs.guard_tool }}
      HEAD_REF: ${{ github.head_ref }}
      HAS_REPAIR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'tp-repair') }}
      # Bot tespiti: GitHub App PR'larında user.type = "Bot"; ek olarak repo değişkeni TP_BOT_LOGINS
      # (virgülle ayrılmış giriş adları; App adı "tp-bot" ise "tp-bot[bot]" de eşleşir).
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
      TP_BOT_LOGINS: ${{ vars.TP_BOT_LOGINS }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout (PR, tam geçmiş)
        if: env.IS_PR == 'true' || env.GUARD_TOOL_CHANGED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Koruma aracı ve mod seçimi PR'ın kendisinden değil, taban daldan çalıştırılır: PR aracı veya
      # mod betiğini değiştirerek kontrolü atlatamaz. Taban dalda yoksa (ilk kurulum) PR'daki sürüm
      # uyarıyla kullanılır.
      - name: Checkout (taban daldaki ast-guard + mod betiği)
        if: env.IS_PR == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: .guard-base
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /toolchain/ast-guard/
            /scripts/github-ast-guard-mode.sh

      - name: Mod
        id: mode
        run: |
          set -euo pipefail
          script=.guard-base/scripts/github-ast-guard-mode.sh
          if [ "$IS_PR" = "true" ] && [ ! -f "$script" ]; then
            echo "::warning::Taban dalda mod betiği yok; PR'daki sürüm kullanılıyor (ilk kurulum)."
            script=scripts/github-ast-guard-mode.sh
          fi
          if [ "$IS_PR" != "true" ]; then
            # PR dışı olaylarda checkout yok; karar sabit: no-op.
            printf 'mode=pr\nrun=false\nreason=PR değil\n' | tee -a "$GITHUB_OUTPUT"
          else
            bash "$script"
          fi
          {
            echo "### AST koruması: mod seçimi"
            grep -E '^(mode|run|reason)=' "$GITHUB_OUTPUT" | tail -n 3 | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Node kurulumu
        if: steps.mode.outputs.run == 'true' || env.GUARD_TOOL_CHANGED == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ast-guard birim testleri (araç değiştiyse)
        if: env.GUARD_TOOL_CHANGED == 'true'
        working-directory: toolchain/ast-guard
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: ast-guard derle
        if: steps.mode.outputs.run == 'true'
        id: tool
        run: |
          set -euo pipefail
          dir=.guard-base/toolchain/ast-guard
          if [ ! -f "$dir/package-lock.json" ]; then
            echo "::warning::Taban dalda ast-guard yok; PR'daki sürüm kullanılıyor (ilk kurulum)."
            dir=toolchain/ast-guard
          fi
          (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          echo "cli=$GITHUB_WORKSPACE/$dir/dist/src/cli.js" >> "$GITHUB_OUTPUT"

      - name: AST koruması (${{ steps.mode.outputs.mode }})
        if: steps.mode.outputs.run == 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          CLI: ${{ steps.tool.outputs.cli }}
        run: |
          set -uo pipefail
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          node "$CLI" --repo . --root "$E2E_ROOT" --base "$base" --head "$HEAD_SHA" \
            --mode "$MODE" --out ast-guard-report.json --quiet
          code=$?
          {
            echo "### AST koruması (mod: \`$MODE\`)"
            if [ -f ast-guard-report.json ]; then
              jq -r '.summary // .error' ast-guard-report.json
              jq -r 'if (.violations // []) | length > 0 then "\n| kod | dosya | açıklama |\n|---|---|---|", (.violations[] | "| `\(.code)` | `\(.file)`\(if .line then ":\(.line)" else "" end) | \(.message | gsub("\\|"; "\\\\|")) |") else empty end' ast-guard-report.json
              jq -r 'if (.testid_changes // []) | length > 0 then "\n**Değişen testId'"'"'ler**\n\n| dosya | giriş | önce | sonra |\n|---|---|---|---|", (.testid_changes[] | "| `\(.file)` | `\(.entry)` | `\(.before)` | `\(.after)` |") else empty end' ast-guard-report.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Rapor artefaktı
        if: always() && steps.mode.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ast-guard-report
          path: ast-guard-report.json
          retention-days: 14
          if-no-files-found: ignore

  semgrep:
    # SAST (Constitution: Semgrep her PR'da koşar). Token/hesap yok; kayıt defteri kuralları.
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep (p/default + p/typescript)
        # Kapsam: test edilen uygulama (demo-app/) ve CI aracı (toolchain/ast-guard/).
        run: |
          semgrep scan --config p/default --config p/typescript \
            --metrics=off --error --disable-version-check \
            --json-output=semgrep.json \
            demo-app toolchain/ast-guard

      - name: Semgrep raporu
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: semgrep.json
          retention-days: 14
          if-no-files-found: ignore

  demo-serve-smoke:
    # Sauce job'unun uygulama başlatma yolunu (scripts/github-demo-serve.sh) kimlik gerektirmeden
    # doğrular: API + vite preview ayağa kalkar, /api/health proxy üzerinden 200, izinli Host (tp-demo.test)
    # kabul, izinsiz Host 403. Zorunlu check değildir; Sauce kimliği eklenmeden önce kırılmayı gösterir.
    name: demo-serve-smoke
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.client_payload.ref || '' }}

      - name: Node kurulumu
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: demo-app/web/package-lock.json

      - name: uv kurulumu
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: demo-app/api/uv.lock

      - name: Duman testi
        env:
          PORT: "8081"
          TP_ALLOWED_HOSTS: tp-demo.test
        run: bash scripts/github-demo-serve.sh --smoke

  golden-drift:
    # AI'sız, deterministik, SAF VERİ: rules/replay golden kayıtlarının kanıt satırları, case
    # beklentileri ve page object eşlemeleri demo-app kaynağıyla hâlâ tutarlı mı (demo-app
    # düzenlemesi golden'ı sessizce eskitmesin). Anayasa II: core venv'i KURULMAZ; ortam yalnızca
    # .github/golden-drift/requirements.txt (pytest + jsonschema + pyyaml). tp_core.gateway,
    # anthropic ve mcp yoktur; ajan döngüsü (test_consistency_flow.py) yerel birim paketinde kalır.
    name: golden-drift
    needs: changes
    if: needs.changes.outputs.goldens == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
      UV_NO_PROJECT: "1"
    defaults:
      run:
        working-directory: .github/golden-drift
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.client_payload.ref || '' }}

      - name: uv kurulumu
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: .github/golden-drift/requirements.txt

      - name: Ajan bağımlılığı yok (anayasa II)
        run: |
          set -euo pipefail
          uv run --no-project --with-requirements requirements.txt python - <<'PY'
          import importlib.util
          import sys

          found = [m for m in ("anthropic", "mcp", "tp_core", "claude_agent_sdk")
                   if importlib.util.find_spec(m) is not None]
          if found:
              sys.exit(f"golden-drift ortamında ajan bağımlılığı var: {found}")
          print("ajan bağımlılığı yok: anthropic, mcp, tp_core, claude_agent_sdk içe aktarılamıyor")
          PY

      - name: Golden sürüklenme testleri
        run: uv run --no-project --with-requirements requirements.txt pytest -q

  sauce:
    # Zorunlu DEĞİL (continue-on-error): Sauce veya tünel hatası PR'ı kilitlemez (§8.5).
    # Her durumda (kimlik yoksa da) `sauce-results` artefaktına sauce.json yazılır: çekirdek
    # "atlandı" / "kırmızı" / "hata"yı ayırır ve Sauce job linkini (job_url) buradan okur.
    name: sauce
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_TETIKLER: ${{ vars.SAUCE_TETIKLER }}
      # saucectl bölge adı: us-west-1 | eu-central-1 | us-east-4 (repo değişkeni SAUCE_REGION)
      SAUCE_REGION: ${{ vars.SAUCE_REGION || 'us-west-1' }}
      SAUCECTL_VERSION: v0.216.4
      # Sauce VM'deki tarayıcı uygulamaya tünel üzerinden bu adla ulaşır; ad runner'da 127.0.0.1'e
      # çözülür (Sauce Connect DNS'i runner tarafında çözer). localhost doğrudan kullanılmaz çünkü
      # Chromium localhost'u proxy'den geçirmez.
      APP_HOST: tp-demo.test
      APP_PORT: "8081"
      TP_TRIGGER: ${{ needs.changes.outputs.trigger }}
    steps:
      - name: Sauce kimliği var mı?
        id: creds
        run: |
          # Sauce'un koştuğu tetikler: repo değişkeni SAUCE_TETIKLER (virgülle; varsayılan
          # push,deploy,nightly). PR'da varsayılan olarak atlanır: hesap tek eşzamanlı oturumla
          # koşuları sıraya sokar ve merge kapısı (zorunlu olmayan) Sauce'u beklemez.
          tetikler=",${SAUCE_TETIKLER:-push,deploy,nightly},"
          if [ "${tetikler#*,"$TP_TRIGGER",}" = "$tetikler" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=Sauce bu tetikte koşmaz ($TP_TRIGGER); SAUCE_TETIKLER=${SAUCE_TETIKLER:-push,deploy,nightly}" >> "$GITHUB_OUTPUT"
          elif [ -n "$SAUCE_USERNAME" ] && [ -n "$SAUCE_ACCESS_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=Sauce kimliği (SAUCE_USERNAME / SAUCE_ACCESS_KEY secret'ları) tanımlı değil" >> "$GITHUB_OUTPUT"
          fi

      # Kimlik yoksa da checkout yapılır: sauce.json'u yazan betik ve test edilen commit gerekir.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.client_payload.ref || '' }}

      - name: Node kurulumu
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: demo-app/web/package-lock.json

      - name: uv kurulumu
        if: steps.creds.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: demo-app/api/uv.lock

      # Uygulama scripts/github-demo-serve.sh ile başlar (API + vite preview; TP_ALLOWED_HOSTS ile
      # tp-demo.test Host başlığına izin verilir). Hazırlık /api/health ile ölçülür: /health SPA geri
      # dönüşüyle her zaman 200 döner, API'nin ayakta olduğunu kanıtlamaz.
      - name: Uygulamayı runner'da başlat (QA ortamı)
        if: steps.creds.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          echo "127.0.0.1 $APP_HOST" | sudo tee -a /etc/hosts >/dev/null
          # Test uçlarının (/test/*) koşu başına sırrı: API ve Sauce'taki testler aynı değeri alır.
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          echo "DEMOAPP_TEST_TOKEN=$token" >> "$GITHUB_ENV"
          mkdir -p results/sauce
          PORT="$APP_PORT" TP_ALLOWED_HOSTS="$APP_HOST" DEMOAPP_TEST_TOKEN="$token" \
            nohup bash scripts/github-demo-serve.sh > results/sauce/serve.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS "http://$APP_HOST:$APP_PORT/api/health" >/dev/null 2>&1; then
              echo "Uygulama hazır: http://$APP_HOST:$APP_PORT"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Uygulama 180 sn içinde hazır olmadı"
          tail -n 100 results/sauce/serve.log
          exit 1

      - name: Bölge eşlemesi
        if: steps.creds.outputs.enabled == 'true'
        id: region
        run: |
          # Sauce Connect v5 de saucectl ile aynı bölge adlarını ister (us-west-1, eu-central-1, us-east-4).
          case "$SAUCE_REGION" in
            us-west-1|eu-central-1|us-east-4) sc="$SAUCE_REGION" ;;
            *) echo "::error::Desteklenmeyen SAUCE_REGION: $SAUCE_REGION"; exit 1 ;;
          esac
          echo "sc=$sc" >> "$GITHUB_OUTPUT"
          echo "tunnel=tp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Sauce Connect tüneli
        if: steps.creds.outputs.enabled == 'true'
        uses: saucelabs/sauce-connect-action@fc54c8b087f2b4b6d4ccc42a2d4bbc64795dfde2 # v3.0.0
        with:
          username: ${{ secrets.SAUCE_USERNAME }}
          accessKey: ${{ secrets.SAUCE_ACCESS_KEY }}
          region: ${{ steps.region.outputs.sc }}
          tunnelName: ${{ steps.region.outputs.tunnel }}
          proxyLocalhost: allow

      - name: saucectl kurulumu
        if: steps.creds.outputs.enabled == 'true'
        uses: saucelabs/saucectl-run-action@283660aa934c02723c497efa151d582a3acc5801 # v4.5.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          saucectl-version: ${{ env.SAUCECTL_VERSION }}
          skip-run: "true"

      # Testler: e2e/tests/**/*.spec.ts — üretilen testler (e2e/tests/generated/) dahil
      # (.sauce/config.yml testMatch).
      - name: Sauce'ta Playwright (Chromium)
        if: steps.creds.outputs.enabled == 'true'
        id: run
        working-directory: demo-app
        env:
          TUNNEL: ${{ steps.region.outputs.tunnel }}
          # Sauce adlarında yalnız A-Z a-z 0-9 - _ kabul edilir
          BUILD: ${{ github.event.repository.name }}-${{ github.run_number }}-${{ needs.changes.outputs.trigger }}
        run: |
          set -euo pipefail
          rc=0
          saucectl run --config .sauce/config.yml \
            --region "$SAUCE_REGION" \
            --tunnel-name "$TUNNEL" \
            --tunnel-timeout 2m \
            --build "$BUILD" \
            -e "BASE_URL=http://$APP_HOST:$APP_PORT" \
            -e "TP_EXTERNAL_SERVER=1" \
            -e "DEMOAPP_TEST_TOKEN=$DEMOAPP_TEST_TOKEN" \
            -e "TP_SAUCE=1" \
            -e "TP_TRIGGER=$TP_TRIGGER" \
            2>&1 | tee ../results/sauce/saucectl.log || rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # Sauce job linki adım özetine VE sauce.json'a (artefakt) yazılır. Kimlik yoksa "atlandi".
      - name: Sauce özeti ve sauce.json
        if: always()
        env:
          ENABLED: ${{ steps.creds.outputs.enabled }}
          SKIP_REASON: ${{ steps.creds.outputs.reason }}
          SAUCE_EXIT: ${{ steps.run.outputs.exit_code }}
          TUNNEL: ${{ steps.region.outputs.tunnel }}
        run: |
          set -euo pipefail
          if [ "$ENABLED" != "true" ]; then
            bash scripts/github-sauce-summary.sh --out tp-sauce --region "$SAUCE_REGION" \
              --skipped "$SKIP_REASON"
            exit 0
          fi
          bash scripts/github-sauce-summary.sh --out tp-sauce \
            --report demo-app/results/sauce/saucectl-report.json \
            --junit demo-app/results/sauce/saucectl-junit.xml \
            --artifacts demo-app/results/sauce/artifacts \
            --log results/sauce/saucectl.log --serve-log results/sauce/serve.log \
            --exit-code "${SAUCE_EXIT:-}" --region "$SAUCE_REGION" --tunnel "${TUNNEL:-}"

      - name: Sauce artefaktları
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Çekirdek bu adla arar: sauce-results (kökte sauce.json).
          name: sauce-results
          retention-days: 14
          if-no-files-found: warn
          path: tp-sauce/
